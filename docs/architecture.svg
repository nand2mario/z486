<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">z486 implemented organization</title>
  <desc id="desc">The frontend reaches D2, which selects either hardwired control or the microsequencer. Both control paths converge on the same EX stage and shared functional units.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <style>.box{stroke-width:2;rx:7}.h{font:600 18px system-ui,sans-serif;fill:#0f172a}.hs{font:600 16px system-ui,sans-serif;fill:#0f172a}.t{font:14px system-ui,sans-serif;fill:#334155}.s{font:12px system-ui,sans-serif;fill:#64748b}.wire{stroke:#475569;stroke-width:2.2;fill:none}.arrow{stroke:#475569;stroke-width:2.2;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:1.8;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1200" height="700" fill="#fff"/>
  <text x="600" y="30" text-anchor="middle" class="h">z486: one datapath, two control paths</text>

  <g text-anchor="middle">
    <rect x="100" y="65" width="140" height="72" class="box" fill="#dbeafe" stroke="#2563eb"/><text x="170" y="95" class="h">I-cache</text><text x="170" y="120" class="t">16-byte line</text>
    <rect x="270" y="65" width="140" height="72" class="box" fill="#cffafe" stroke="#0891b2"/><text x="340" y="95" class="h">Prefetch</text><text x="340" y="120" class="t">32-byte queue</text>
    <rect x="440" y="65" width="140" height="72" class="box" fill="#fef3c7" stroke="#d97706"/><text x="510" y="95" class="h">D1</text><text x="510" y="120" class="t">structure + entry</text>
    <rect x="610" y="65" width="180" height="72" class="box" fill="#ffedd5" stroke="#ea580c"/><text x="700" y="95" class="h">D2 / ROM</text><text x="700" y="120" class="t">literals + EA</text>
  </g>
  <path d="M240 101H263" class="arrow"/>
  <path d="M410 101H433" class="arrow"/>
  <path d="M580 101H603" class="arrow"/>

  <g text-anchor="middle">
    <rect x="430" y="205" width="250" height="92" class="box" fill="#f3e8ff" stroke="#9333ea"/><text x="555" y="237" class="h">Hardwired control</text><text x="555" y="261" class="t">34 generated recipes</text><text x="555" y="282" class="s">issue, hazards, chaining</text>
    <rect x="720" y="205" width="250" height="92" class="box" fill="#ede9fe" stroke="#7c3aed"/><text x="845" y="237" class="h">Microsequencer</text><text x="845" y="261" class="t">original 386 routines</text><text x="845" y="282" class="s">faults, protection, complex ops</text>
  </g>

  <!-- D2 selects one of the two control paths. -->
  <path d="M700 137V172" class="wire"/>
  <path d="M700 172H555V198" class="arrow"/>
  <path d="M700 172H845V198" class="arrow"/>

  <!-- Both controllers converge on the shared EX stage. -->
  <path d="M555 297V326H845V297" class="wire"/>
  <path d="M700 326V353" class="arrow"/>

  <g text-anchor="middle">
    <rect x="525" y="360" width="350" height="86" class="box" fill="#dcfce7" stroke="#16a34a"/><text x="700" y="394" class="h">EX + same-cycle commit</text><text x="700" y="420" class="t">shared architectural datapath</text>
  </g>

  <!-- EX fans out to shared functional units; control ownership no longer matters here. -->
  <path d="M700 446V480H125M700 480H1045" class="wire"/>
  <path d="M125 480V513" class="arrow"/>
  <path d="M355 480V513" class="arrow"/>
  <path d="M585 480V513" class="arrow"/>
  <path d="M815 480V513" class="arrow"/>
  <path d="M1045 480V513" class="arrow"/>

  <g text-anchor="middle">
    <rect x="25" y="520" width="200" height="100" class="box" fill="#f1f5f9" stroke="#475569"/><text x="125" y="553" class="h">Address Unit</text><text x="125" y="578" class="t">EA, IND, stack</text><text x="125" y="599" class="s">segmentation boundary</text>
    <rect x="255" y="520" width="200" height="100" class="box" fill="#f1f5f9" stroke="#475569"/><text x="355" y="553" class="h">Data Unit</text><text x="355" y="578" class="t">GPRs, ALU, shift</text><text x="355" y="599" class="s">multiply / divide</text>
    <rect x="485" y="520" width="200" height="100" class="box" fill="#ecfeff" stroke="#0e7490"/><text x="585" y="553" class="h">Paging + TLB</text><text x="585" y="578" class="t">translation, faults</text><text x="585" y="599" class="s">32-entry TLB</text>
    <rect x="715" y="520" width="200" height="100" class="box" fill="#e0f2fe" stroke="#0369a1"/><text x="815" y="553" class="h">Memory</text><text x="815" y="578" class="t">8K I + 8K D cache</text><text x="815" y="599" class="s">store queue + SDRAM</text>
    <rect x="945" y="520" width="200" height="100" class="box" fill="#fae8ff" stroke="#a21caf"/><text x="1045" y="553" class="h">x87</text><text x="1045" y="578" class="t">control + executor</text>
  </g>

  <path d="M945 570H922" class="dash"/>
  <text x="930" y="650" text-anchor="middle" class="s">x87 operands use the normal fault-checked memory path</text>
</svg>
